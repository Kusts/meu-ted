version: '3.9'

services:
  postgres:
    image: postgres:17-alpine
    container_name: pi-financeiro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pi_financeiro_dev_secret
      POSTGRES_DB: pi_financeiro
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"  # Use 5433 since 5432 is taken
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pi_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Evolution API for WhatsApp (placeholder for future)
  # evolution-api:
  #   image: atendai/evolution-api:latest
  #   container_name: pi-financeiro-whatsapp
  #   environment:
  #     - SERVER_URL=${SERVER_URL:-http://localhost:8080}
  #     - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
  #     - DATABASE_PROVIDER=postgresql
  #     - DATABASE_CONNECTION_URI=postgresql://pi_financeiro:pi_financeiro_dev_secret@postgres:5432/pi_financeiro
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - postgres

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: pi-financeiro-network