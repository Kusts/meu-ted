services:
  postgres:
    image: postgres:17-alpine
    container_name: pi-financeiro-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pi_financeiro_dev_secret
      POSTGRES_DB: pi_financeiro
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pi_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cron worker container for pg-boss jobs
  cron-worker:
    build:
      context: .
      dockerfile: Dockerfile.cron
    container_name: pi-financeiro-cron
    environment:
      - DATABASE_URL=postgresql://postgres:pi_financeiro_dev_secret@postgres:5432/pi_financeiro
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy

  # Evolution GO API is installed separately (not in Docker)
  # URL: http://localhost:4000  |  Instance: ted  |  Token in .env

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: pi-financeiro-network
