name: PWA Deploy

on:
  workflow_run:
    workflows: ["CI", "PWA CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: pwa-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate — CI + PWA CI green for SHA
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require CI and PWA CI success for the deployed SHA
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const sha = process.env.HEAD_SHA;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              head_sha: sha,
              per_page: 50,
            });
            for (const name of ['CI', 'PWA CI']) {
              const runs = data.workflow_runs.filter((r) => r.name === name);
              if (runs.length === 0) {
                // No run for this SHA (e.g. PWA CI path filters unmatched):
                // nothing to enforce; the CI workflow's own pwa jobs still ran.
                core.info(`No ${name} runs for ${sha} — skipping that requirement.`);
                continue;
              }
              const latest = runs.sort((a, b) => b.created_at.localeCompare(a.created_at))[0];
              core.info(`${name}: latest run #${latest.run_number} conclusion=${latest.conclusion}`);
              if (latest.conclusion !== 'success') {
                core.setFailed(`Deploy blocked: ${name} latest conclusion for ${sha} is '${latest.conclusion}'.`);
                return;
              }
            }
            core.info(`Deploy gate passed for ${sha}.`);

  deploy:
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PWA (Cloudflare)
        run: pnpm --dir apps/pwa build:cloudflare

      - name: Deploy to Cloudflare Workers
        run: pnpm --dir apps/pwa exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  smoke:
    name: Post-deploy smoke (read-only)
    needs: [deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PWA_PROD_URL: https://pi-finance-pwa.walissonead.workers.dev
      API_PROD_URL: https://api.synkroo.com.br
    steps:
      - name: Checkout deployed SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: PWA root serves HTTP 200 (public GET only)
        run: |
          curl -fsS -o /dev/null -w "%{http_code}\n" "$PWA_PROD_URL/"

      - name: API health serves HTTP 200 (public GET only)
        run: |
          curl -fsS "$API_PROD_URL/health"

      - name: Install Playwright browser
        run: pnpm --dir apps/pwa exec playwright install --with-deps chromium

      # Same read-only production-smoke logic as production-smoke.yml
      # (SMOKE-01..04: unauthenticated registration shell, GET/HEAD/OPTIONS
      # only — the spec fails closed on any emitted write), pinned to the
      # deployed SHA. Fails this workflow when the smoke fails.
      - name: Run read-only smoke against deployed URL
        env:
          E2E_PRODUCTION_SMOKE: "1"
          E2E_PRODUCTION_URL: ${{ env.PWA_PROD_URL }}
        run: pnpm --dir apps/pwa exec playwright test --config=e2e/playwright.config.ts --project=production-smoke --workers=1 --retries=0
