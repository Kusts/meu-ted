name: Production smoke

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Already deployed PWA URL (read-only smoke target)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only production smoke
    runs-on: ubuntu-latest
    environment: production-smoke
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: volta-cli/action@615a78f6c83e116339c53b94f3f82b4d6c0b7d18 # v5.0.0
      - run: pnpm install --frozen-lockfile
      - name: Run read-only smoke against deployed URL
        env:
          E2E_PRODUCTION_SMOKE: "1"
          E2E_PRODUCTION_URL: ${{ inputs.production_url }}
        run: pnpm --dir apps/pwa exec playwright test --config=e2e/playwright.config.ts --project=production-smoke --workers=1 --retries=0
