name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API ──────────────────────────────────────────────────────────────
  api:
    name: API — lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      - run: pnpm --filter meu-ted-api --fail-if-no-match lint
      - run: pnpm --filter meu-ted-api --fail-if-no-match typecheck
      - run: pnpm --filter meu-ted-api --fail-if-no-match test
      - run: pnpm --filter meu-ted-api --fail-if-no-match build

  # ─── Agent ────────────────────────────────────────────────────────────
  agent:
    name: Agent — typecheck + test + deterministic eval + architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      - run: pnpm --filter pi-finance-agent --fail-if-no-match typecheck
      - run: pnpm --filter pi-finance-agent --fail-if-no-match test
      - run: pnpm --filter pi-finance-agent --fail-if-no-match eval:ted-v2
      - run: pnpm architecture:check
      - run: pnpm --filter pi-finance-agent --fail-if-no-match build

  # ─── Codex Broker ─────────────────────────────────────────────────────
  broker:
    name: Codex Broker — typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pi-finance-codex-broker --fail-if-no-match typecheck
      - run: pnpm --filter pi-finance-codex-broker --fail-if-no-match test
      - run: pnpm --filter pi-finance-codex-broker --fail-if-no-match build

  # ─── PWA ──────────────────────────────────────────────────────────────
  pwa:
    name: PWA — lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      - run: pnpm --filter pwa --fail-if-no-match typecheck
      - run: pnpm --filter pwa --fail-if-no-match lint
      - run: pnpm --filter pwa --fail-if-no-match build
      - run: pnpm --filter pwa --fail-if-no-match test

  # ─── PWA Cloudflare build ─────────────────────────────────────────────
  # Same-SHA Cloudflare build coverage for the main gate (mirrors the
  # build-relevant steps of PWA CI quality). Full E2E stays in PWA CI and
  # is enforced at deploy time by the CI + PWA CI deploy gate.
  pwa-cloudflare:
    name: PWA — Cloudflare build + headers + JS budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts (workspace exports resolve dist)
        run: pnpm --filter @pi-finance/llm-contracts build
      - run: pnpm --dir apps/pwa build:cloudflare
      - run: pnpm --dir apps/pwa exec vitest run src/headers.test.ts
      - name: Check initial JS gzip <=200KB
        run: |
          cd apps/pwa
          node -e "
          const z=require('zlib'),fs=require('fs');
          const d='.open-next/assets/_next/static/chunks';
          const files=fs.readdirSync(d).filter(f=>f.endsWith('.js'));
          const init=files.filter(f=>['framework','main-','polyfills'].some(p=>f.startsWith(p)))
            .reduce((s,f)=>{try{return s+z.gzipSync(fs.readFileSync(d+'/'+f)).length}catch{return s}},0);
          console.log('initial JS gzip: '+(init/1024).toFixed(1)+'KB');
          if(init>200*1024){console.log('FAIL: >200KB');process.exit(1)}
          "

  # ─── Postgres integration ────────────────────────────────────────────
  postgres:
    name: Postgres — integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pi_financeiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Create disposable database marker
        run: |
          PGPASSWORD=test psql -h localhost -U test -d pi_financeiro_test \
            -c "CREATE TABLE IF NOT EXISTS _test_marker (marker_value TEXT NOT NULL); TRUNCATE _test_marker; INSERT INTO _test_marker(marker_value) VALUES ('ci-test-marker-00000000-0000-0000-0000-000000000001');"
      - run: pnpm --filter meu-ted-api test:integration
        env:
          DATABASE_URL_TEST: postgres://test:test@localhost:5432/pi_financeiro_test
          DB_TEST_MARKER: ci-test-marker-00000000-0000-0000-0000-000000000001

  # ─── Docker image builds ─────────────────────────────────────────────
  docker:
    name: Docker — API + Codex Broker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t pi-finance-api:ci .
      - name: Build Codex Broker image
        run: docker build -f apps/codex-broker/Dockerfile -t pi-finance-codex-broker:ci .
      - name: Smoke API and Codex Broker containers
        run: pnpm container:smoke

  # ─── Capability inventory gate ────────────────────────────────────────
  capabilities:
    name: Capability inventory — 72 registered tools classified
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm capabilities:check
      - run: node --test scripts/check-tool-capability-inventory.test.mjs

  # ─── Write/mutator policy gate ───────────────────────────────────────
  write-policy:
    name: Write policy — every mutator has a policy row
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm write-policy:check
      - run: node --test scripts/check-write-policy.test.mjs

  # ─── Governance gate ─────────────────────────────────────────────────
  governance:
    name: Governance — ADR decision gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: |
          if [ -n "$GITHUB_BASE_SHA" ]; then
            pnpm governance:check -- --base "$GITHUB_BASE_SHA"
          else
            pnpm governance:check
          fi
      - run: node --test scripts/check-decision-governance.test.mjs

  # ─── Security gates ───────────────────────────────────────────────────
  security:
    name: Security — secrets + dependencies + containers
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm security:secrets
      - run: pnpm security:deps
      - uses: docker/setup-buildx-action@v3
      - name: Build API image for scan
        run: docker build -f apps/api/Dockerfile -t pi-finance-api:ci .
      - name: Build Codex Broker image for scan
        run: docker build -f apps/codex-broker/Dockerfile -t pi-finance-codex-broker:ci .
      - run: pnpm security:containers

  # ─── Documentation gate ──────────────────────────────────────────────
  docs:
    name: Documentation — lint + facts + plans
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:lint
      - run: pnpm plans:check
      - run: node --test scripts/lint-docs.test.mjs scripts/check-active-plan-status.test.mjs scripts/canonical-docs-contract.test.mjs scripts/documentation-facts-contract.test.mjs

  # ─── Global gate ──────────────────────────────────────────────────────
  gate:
    name: Gate — all checks
    needs: [api, agent, broker, pwa, pwa-cloudflare, postgres, docker, capabilities, write-policy, governance, security, docs]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI checks passed."
