# V4.1 Phase 9 (Task 9.11) — keep third-party Actions on pinned,
# reviewable versions. The `action-pins:check` gate (`pnpm action-pins:check`)
# fails on floating refs (@main/@master/unversioned).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
