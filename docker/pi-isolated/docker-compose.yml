name: pi-isolated

services:
  pi:
    build:
      context: ../..
      dockerfile: docker/pi-isolated/Dockerfile
    container_name: pi-isolated
    # HOME isolado dentro do container
    env_file:
      - ../../.env.pi
    volumes:
      # Monta apenas o repo — NADA do host ~/.claude ou ~/.pi
      - ../../:/workspace
      # HOME isolado do Pi persiste aqui
      - pi-home:/home/pi
    working_dir: /workspace
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true

volumes:
  pi-home: